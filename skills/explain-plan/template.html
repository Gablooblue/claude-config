<title>{{TITLE}}</title>
<!-- Fixed template for the explain-plan skill. Fill the double-brace tokens only. Never restructure. -->
<style>
:root{
  --bg:#f8f9fb;--card:#eef0f4;--ink:#1a1d23;--muted:#5d6470;--line:#e2e5ea;
  --accent:#1e4fd8;--accent-soft:#e4eafc;
  --red:#b42318;--red-soft:#fbeae8;--amber:#9a5b00;--amber-soft:#f9efdc;
  --green:#15803d;--green-soft:#e4f3e9;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1013;--card:#181b21;--ink:#e7e9ec;--muted:#8b919d;--line:#252932;
    --accent:#8fa8ff;--accent-soft:#1d2740;
    --red:#f08c84;--red-soft:#3a201d;--amber:#e5b567;--amber-soft:#39290f;
    --green:#7fce9b;--green-soft:#16301f;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1013;--card:#181b21;--ink:#e7e9ec;--muted:#8b919d;--line:#252932;
  --accent:#8fa8ff;--accent-soft:#1d2740;
  --red:#f08c84;--red-soft:#3a201d;--amber:#e5b567;--amber-soft:#39290f;
  --green:#7fce9b;--green-soft:#16301f;
}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Avenir Next",ui-sans-serif,system-ui,sans-serif;margin:0;padding-bottom:5rem}
main{max-width:72rem;margin:0 auto;padding:0 1.5rem}
section{scroll-margin-top:3.5rem}
h1,h2{text-wrap:balance}
#components,#checks,#map,#risks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(23rem,100%),1fr));gap:0 2.5rem;align-items:start}
#components h2,#checks h2,#map h2,#risks h2{grid-column:1/-1;margin-bottom:0;border-bottom:0;padding-bottom:.2rem}
#map pre.mermaid{grid-column:1/-1}
#components details,#map details,#risks details,#checks .check{margin:0}
details[open]{grid-column:1/-1}
details ul{max-width:80ch}
#glossary dl.card{columns:2 24rem;column-gap:3rem}
dl.card dt{break-inside:avoid;break-after:avoid}
dl.card dd{break-inside:avoid}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:1.4rem;padding:.6rem 1.5rem;font-size:.72rem;z-index:9;overflow-x:auto;text-transform:uppercase;letter-spacing:.06em;font-variant-numeric:tabular-nums}
nav a{color:var(--muted);text-decoration:none;white-space:nowrap;font-weight:600}
nav a strong{color:var(--ink);font-weight:700}
h1{font-size:1.4rem;font-weight:600;letter-spacing:-.01em;margin:1.6rem 0 .3rem}
h2{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2.4rem 0 .6rem;border-bottom:1px solid var(--line);padding-bottom:.45rem}
.card{background:transparent;border:0;border-radius:0;padding:0}
#tldr h2{color:var(--accent);border-color:var(--line)}
#tldr .card{max-width:80ch}
#tldr p{margin:.4rem 0;font-size:1.05rem;line-height:1.6}
details{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;margin:0;padding:0}
details[open]{padding-bottom:.8rem}
summary{cursor:pointer;padding:.55rem 0;font-weight:600;font-size:.9rem;display:flex;gap:.55rem;align-items:baseline;flex-wrap:wrap}
.badge{font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:.35em}
.badge::before{content:"";width:.5em;height:.5em;border-radius:50%;background:currentColor}
.badge.red{color:var(--red)}
.badge.amber{color:var(--amber)}
.badge.green{color:var(--green)}
.badge.new{color:var(--accent)}
code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.85em;background:transparent;padding:0;overflow-wrap:anywhere}
pre{background:var(--card);border:0;border-radius:8px;padding:.55rem .75rem;overflow-x:auto;max-width:100%;font:.78rem/1.55 ui-monospace,"SF Mono",Menlo,monospace}
pre.mermaid{background:var(--card);border:0;border-radius:10px;padding:1rem;overflow-x:auto}
ul{padding-left:1.1rem;margin:.3rem 0}
li{margin:.25rem 0}
.check{display:flex;gap:.6rem;align-items:flex-start;background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:.6rem 0;margin:0}
.check input{margin-top:.3rem}
.check>div{min-width:0;flex:1}
.check pre{margin:.45rem 0 0}
.check strong{font-size:.9rem}
.copy{float:right;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:0;background:transparent;color:var(--accent);cursor:pointer;padding:.15rem .3rem}
dl.card dt{font-weight:600;margin-top:.85rem}
dl.card dd{margin:0;color:var(--muted)}
ol.card{padding-left:1.3rem;max-width:80ch;margin:.3rem 0}
nav a:hover{color:var(--accent)}
summary:hover{color:var(--accent)}
.copy:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type="checkbox"]{accent-color:var(--accent)}
::selection{background:var(--accent-soft)}
</style>
<nav>
  <a href="#tldr"><strong>TL;DR</strong></a>
  <a href="#map">Plan-to-code</a>
  <a href="#risks">Risks ({{RISK_COUNT}})</a>
  <a href="#questions">Questions</a>
  <a href="#glossary">Glossary</a>
</nav>
<main>
  <h1>{{TITLE}}</h1>
  <section id="tldr">
    <h2>TL;DR</h2>
    <div class="card">{{TLDR_HTML}}</div>
  </section>
  <section id="map">
    <h2>Plan-to-code map</h2>
    <pre class="mermaid">{{PLAN_MERMAID}}</pre>
    {{MAP_ITEMS}}
  </section>
  <section id="risks">
    <h2>Risk flags</h2>
    {{RISK_ITEMS}}
  </section>
  <section id="questions">
    <h2>Ask the agent before approving</h2>
    <ol class="card">{{QUESTION_ITEMS}}</ol>
  </section>
  <section id="glossary">
    <h2>Glossary</h2>
    <dl class="card">{{GLOSSARY_ITEMS}}</dl>
  </section>
</main>
<script>
document.addEventListener('click',function(e){
  if(!e.target.classList.contains('copy'))return;
  var pre=e.target.closest('.check').querySelector('pre');
  navigator.clipboard.writeText(pre.textContent).then(function(){
    e.target.textContent='copied';setTimeout(function(){e.target.textContent='copy'},1200);
  });
});
/* Mermaid fallback: the artifact viewer renders pre.mermaid natively; a local file has no
   mermaid runtime, so load one from CDN. Inside an artifact the CSP blocks this request,
   which is correct - the native renderer already ran. */
window.addEventListener('load',function(){
  setTimeout(function(){
    var pres=document.querySelectorAll('pre.mermaid');
    if(!pres.length)return;
    var done=Array.prototype.some.call(pres,function(p){return p.querySelector('svg')||!p.isConnected});
    if(done)return;
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
    s.onload=function(){
      mermaid.initialize({startOnLoad:false,theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
      mermaid.run({querySelector:'pre.mermaid'});
    };
    document.head.appendChild(s);
  },800);
});
</script>
