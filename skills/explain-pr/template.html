<title>{{TITLE}}</title>
<!-- Fixed template for the explain-pr skill. Fill the double-brace tokens only. Never restructure. -->
<style>
:root{
  --bg:#f6f6f4;--card:#ffffff;--ink:#191919;--muted:#66665f;--line:#e3e3dd;
  --accent:#2563eb;--accent-soft:#dbeafe;
  --red:#b91c1c;--red-soft:#fde8e8;--amber:#92400e;--amber-soft:#fdf0d2;
  --green:#166534;--green-soft:#ddf3e4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121316;--card:#1c1e22;--ink:#e9e9e6;--muted:#9b9b95;--line:#2b2e34;
    --accent:#7aa7ff;--accent-soft:#22304d;
    --red:#f08585;--red-soft:#3c2222;--amber:#e8b45a;--amber-soft:#3a2f16;
    --green:#7ed09a;--green-soft:#1d3527;
  }
}
:root[data-theme="dark"]{
  --bg:#121316;--card:#1c1e22;--ink:#e9e9e6;--muted:#9b9b95;--line:#2b2e34;
  --accent:#7aa7ff;--accent-soft:#22304d;
  --red:#f08585;--red-soft:#3c2222;--amber:#e8b45a;--amber-soft:#3a2f16;
  --green:#7ed09a;--green-soft:#1d3527;
}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif;margin:0;padding-bottom:4rem}
main{max-width:72rem;margin:0 auto;padding:0 1.25rem}
section{scroll-margin-top:3.25rem}
h1,h2{text-wrap:balance}
#components,#checks,#map,#risks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(23rem,100%),1fr));gap:.5rem;align-items:start}
#components h2,#checks h2,#map h2,#risks h2{grid-column:1/-1;margin-bottom:0}
#map pre.mermaid{grid-column:1/-1}
#components details,#map details,#risks details,#checks .check{margin:0}
details[open]{grid-column:1/-1}
details ul{max-width:80ch}
#glossary dl.card{columns:2 24rem;column-gap:2.5rem}
dl.card dt{break-inside:avoid;break-after:avoid}
dl.card dd{break-inside:avoid}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:1rem;padding:.65rem 1rem;font-size:.9rem;z-index:9;overflow-x:auto}
nav a{color:var(--muted);text-decoration:none;white-space:nowrap}
nav a strong{color:var(--ink)}
h1{font-size:1.3rem;margin:1.2rem 0 .2rem}
h2{font-size:1.1rem;margin:1.6rem 0 .6rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem}
#tldr h2{color:var(--accent)}
#tldr .card{max-width:80ch}
#tldr p{margin:.3rem 0}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:.45rem 0;padding:.15rem .7rem}
details[open]{padding-bottom:.6rem}
summary{cursor:pointer;padding:.5rem 0;font-weight:600;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.badge{font-size:.72rem;font-weight:700;padding:.15rem .5rem;border-radius:99px;letter-spacing:.02em}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.new{background:var(--accent-soft);color:var(--accent)}
code{background:var(--accent-soft);border-radius:4px;padding:.05rem .3rem;font-size:.88em;overflow-wrap:anywhere}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.4rem .6rem;overflow-x:auto;max-width:100%}
pre.mermaid{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;overflow-x:auto}
ul{padding-left:1.1rem}
li{margin:.2rem 0}
.check{display:flex;gap:.6rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;margin:.5rem 0}
.check input{margin-top:.25rem}
.check>div{min-width:0;flex:1}
.check pre{margin:.4rem 0 0}
.copy{float:right;font-size:.75rem;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:6px;padding:.1rem .5rem;cursor:pointer}
dl.card dt{font-weight:600;margin-top:.7rem}
dl.card dd{margin:0;color:var(--muted)}
nav a:hover{color:var(--ink)}
summary:hover{color:var(--accent)}
.copy:hover{color:var(--ink);border-color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type="checkbox"]{accent-color:var(--accent)}
::selection{background:var(--accent-soft)}
</style>
<nav>
  <a href="#tldr"><strong>TL;DR</strong></a>
  <a href="#flow">Flow</a>
  <a href="#components">Components ({{COMPONENT_COUNT}})</a>
  <a href="#checks">Checks ({{CHECK_COUNT}})</a>
  <a href="#glossary">Glossary</a>
</nav>
<main>
  <h1>{{TITLE}}</h1>
  <section id="tldr">
    <h2>TL;DR</h2>
    <div class="card">{{TLDR_HTML}}</div>
  </section>
  <section id="flow">
    <h2>What changes in the flow</h2>
    <pre class="mermaid">{{FLOW_MERMAID}}</pre>
  </section>
  <section id="components">
    <h2>Touched components</h2>
    {{COMPONENT_ITEMS}}
  </section>
  <section id="checks">
    <h2>Check this yourself</h2>
    {{CHECK_ITEMS}}
  </section>
  <section id="glossary">
    <h2>Glossary</h2>
    <dl class="card">{{GLOSSARY_ITEMS}}</dl>
  </section>
</main>
<script>
document.addEventListener('click',function(e){
  if(!e.target.classList.contains('copy'))return;
  var pre=e.target.closest('.check').querySelector('pre');
  navigator.clipboard.writeText(pre.textContent).then(function(){
    e.target.textContent='copied';setTimeout(function(){e.target.textContent='copy'},1200);
  });
});
</script>
